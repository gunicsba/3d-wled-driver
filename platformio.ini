; XMasTractor - Christmas light controller on the AgIsoAuxInputs brain board
; (ESP32-S3, addressable LEDs on GPIO7 / header H7). No ISOBUS/CAN needed.
; One firmware for every module: name and LED count are set on each module's
; web page and stored in NVS.
[platformio]
default_envs = xmas

[env:xmas]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.0
    bblanchon/ArduinoJson @ ^7.0.0
    pangodream/ESP2SOTA @ ^1.0.1

; After the first USB flash: pio run -e xmas_ota -t upload --upload-port <name>.local
[env:xmas_ota]
extends = env:xmas
upload_protocol = espota
